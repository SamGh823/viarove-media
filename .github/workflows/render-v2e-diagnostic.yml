name: Render VIAROVE V2E diagnostic
on:
  push:
    paths:
      - 'incoming/V2E.ready'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg and render
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics media
          sudo apt-get update > diagnostics/v2e.log 2>&1
          sudo apt-get install -y ffmpeg >> diagnostics/v2e.log 2>&1
          bash scripts/render_v2_quality_music.sh >> diagnostics/v2e.log 2>&1
          code=$?
          if [ "$code" -eq 0 ]; then echo SUCCESS > diagnostics/V2E_STATUS.txt; else echo FAILED:$code > diagnostics/V2E_STATUS.txt; fi
          tail -n 120 diagnostics/v2e.log >> diagnostics/V2E_STATUS.txt
      - name: Commit result
        if: always()
        shell: bash
        run: |
          git config user.name "VIAROVE Bot"
          git config user.email "actions@users.noreply.github.com"
          git add diagnostics/V2E_STATUS.txt diagnostics/v2e.log
          if [ -f media/VIAROVE_V2_QUALITY_MUSIC_TEST.mp4 ]; then git add media/VIAROVE_V2_QUALITY_MUSIC_TEST.mp4; fi
          git commit -m "VIAROVE V2E diagnostic result" || exit 0
          git pull --rebase || true
          git push
