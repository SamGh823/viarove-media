name: Rebuild VIAROVE Video

on:
  push:
    paths:
      - 'bridge/chunks/**'
      - '.github/workflows/rebuild-video.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild MP4
        run: |
          mkdir -p media
          cat bridge/chunks/part*.b64 | base64 -d > media/VIAROVE_PLATFORM_TEST_UPLOAD.mp4
          test "$(stat -c%s media/VIAROVE_PLATFORM_TEST_UPLOAD.mp4)" -eq 650563
          sha256sum media/VIAROVE_PLATFORM_TEST_UPLOAD.mp4
      - name: Commit rebuilt video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/VIAROVE_PLATFORM_TEST_UPLOAD.mp4
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild VIAROVE platform test video"
          git push
