name: Build VIAROVE V6 Library Test

on:
  push:
    paths:
      - 'v6-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Download V5 high-quality video
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            'https://drive.google.com/uc?export=download&id=15YY3jewMO8s0z3OZ4lMHUvxh360lGO3a' \
            -o /tmp/v5.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=index,codec_type,codec_name,width,height,bit_rate -of json /tmp/v5.mp4

      - name: Download licensed Mixkit track
        run: |
          set -euo pipefail
          TRACK='https://assets.mixkit.co/music/preview/mixkit-dirty-thinkin-989.mp3'
          curl -L --fail --retry 3 -A 'Mozilla/5.0' "$TRACK" -o /tmp/music.mp3
          test -s /tmp/music.mp3
          ffprobe -v error -show_entries format=duration,size,bit_rate -show_entries stream=codec_name,sample_rate,channels,bit_rate -of json /tmp/music.mp3

      - name: Render V6 without re-encoding video
        run: |
          set -euo pipefail
          mkdir -p media
          # Keep the exact V5 video stream; replace only the old soundtrack.
          # Normalize the professional library music and add very short edge fades.
          ffmpeg -y \
            -i /tmp/v5.mp4 \
            -ss 0 -i /tmp/music.mp3 \
            -map 0:v:0 -map 1:a:0 \
            -c:v copy \
            -af "loudnorm=I=-13:LRA=8:TP=-1.2,afade=t=in:st=0:d=0.12,afade=t=out:st=12.1:d=0.4" \
            -c:a aac -b:a 320k -ar 48000 \
            -t 12.5 -movflags +faststart \
            media/VIAROVE_V6_MIXKIT_DIRTY_THINKIN.mp4
          ffprobe -v error -show_entries format=duration,size,bit_rate -show_entries stream=index,codec_type,codec_name,width,height,bit_rate,sample_rate,channels -of json media/VIAROVE_V6_MIXKIT_DIRTY_THINKIN.mp4 | tee media/VIAROVE_V6_MIXKIT_DIRTY_THINKIN.ffprobe.json

      - name: Commit V6
        run: |
          set -euo pipefail
          git config user.name 'VIAROVE Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add media/VIAROVE_V6_MIXKIT_DIRTY_THINKIN.mp4 media/VIAROVE_V6_MIXKIT_DIRTY_THINKIN.ffprobe.json
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Render VIAROVE V6 with Mixkit Dirty Thinkin'
          git push
