name: Build VIAROVE V6 Library Test

on:
  pull_request:
    paths:
      - 'v6-trigger.txt'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Download V5 high-quality video
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -A 'Mozilla/5.0' \
            'https://drive.google.com/uc?export=download&id=15YY3jewMO8s0z3OZ4lMHUvxh360lGO3a' \
            -o /tmp/v5.mp4
          ffprobe -v error -show_entries format=duration,size,bit_rate -show_entries stream=index,codec_type,codec_name,width,height,bit_rate -of json /tmp/v5.mp4 | tee /tmp/source.json

      - name: Download selected professional-library track
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            'https://raw.githubusercontent.com/Ankhtepot/Placeholders/24d35168b1bd84130b75a9a7e134eef183d433e8/public/mp3/Hope/mixkit-dirty-thinkin-989.mp3' \
            -o /tmp/music.mp3
          test -s /tmp/music.mp3
          ffprobe -v error -show_entries format=duration,size,bit_rate -show_entries stream=codec_name,sample_rate,channels,bit_rate -of json /tmp/music.mp3 | tee /tmp/music.json

      - name: Render V6 while preserving V5 video stream
        run: |
          set -euo pipefail
          mkdir -p out
          ffmpeg -y \
            -i /tmp/v5.mp4 \
            -ss 0 -i /tmp/music.mp3 \
            -map 0:v:0 -map 1:a:0 \
            -c:v copy \
            -af "loudnorm=I=-13:LRA=8:TP=-1.2,afade=t=in:st=0:d=0.08,afade=t=out:st=12.1:d=0.4" \
            -c:a aac -b:a 320k -ar 48000 \
            -t 12.5 -movflags +faststart \
            out/VIAROVE_V6_MIXKIT_DIRTY_THINKIN.mp4
          ffprobe -v error -show_entries format=duration,size,bit_rate -show_entries stream=index,codec_type,codec_name,width,height,bit_rate,sample_rate,channels -of json out/VIAROVE_V6_MIXKIT_DIRTY_THINKIN.mp4 | tee out/VIAROVE_V6_FFPROBE.json
          cp /tmp/music.json out/VIAROVE_V6_MUSIC_FFPROBE.json

      - uses: actions/upload-artifact@v4
        with:
          name: viarove-v6-review
          path: out/
          retention-days: 7
