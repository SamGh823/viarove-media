name: Fetch VIAROVE V11 Neo Soul Source

on:
  pull_request:
    paths:
      - 'v11-trigger.txt'
  workflow_dispatch:

jobs:
  fetch-music:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Fetch Mr Smith Neo Soul from Free Music Archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          PAGE='https://freemusicarchive.org/music/mr-smith/a-new-roar/neo-soul/'
          curl -L --fail --retry 3 -A 'Mozilla/5.0' "$PAGE" -o /tmp/page.html
          python3 - <<'PY'
          import re, html
          text=html.unescape(open('/tmp/page.html','r',encoding='utf-8',errors='ignore').read()).replace('\\/','/')
          urls=[]
          pats=[r'https://files\.freemusicarchive\.org/storage-freemusicarchive-org/tracks/[^"\'<> ]+?\.mp3',r'"fileUrl"\s*:\s*"(https:[^"]+?\.mp3)"']
          for p in pats:
              for m in re.finditer(p,text):
                  u=m.group(1) if m.groups() else m.group(0)
                  if u not in urls: urls.append(u)
          if not urls: raise SystemExit('No MP3 URL found')
          open('/tmp/music_url.txt','w').write(urls[0])
          print(urls[0])
          PY
          MUSIC_URL=$(cat /tmp/music_url.txt)
          curl -L --fail --retry 3 -A 'Mozilla/5.0' "$MUSIC_URL" -o out/Mr_Smith_Neo_Soul.mp3
          ffprobe -v error -show_entries format=duration,size,bit_rate:format_tags=artist,title,album -show_entries stream=codec_name,sample_rate,channels,bit_rate -of json out/Mr_Smith_Neo_Soul.mp3 > out/ffprobe.json
          printf '%s\n' 'Track: Neo Soul' 'Artist: Mr Smith / Robin Smith' 'Source: Free Music Archive' 'License: CC BY 4.0' 'AI generated: No (per FMA metadata)' 'Attribution required.' "Source URL: $PAGE" > out/LICENSE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: viarove-v11-neosoul-source
          path: out/
          retention-days: 7
