name: Render VIAROVE V2B
on:
  push:
    paths:
      - 'incoming/V2B.ready'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/render_v2_quality_music.sh
      - run: |
          git config user.name "VIAROVE Bot"
          git config user.email "actions@users.noreply.github.com"
          git add media/VIAROVE_V2_QUALITY_MUSIC_TEST.mp4
          git commit -m "Render VIAROVE V2B quality music test" || exit 0
          git push
