name: Fetch VIAROVE V10 Soul Sync Source

on:
  pull_request:
    paths:
      - 'v10-trigger.txt'
  workflow_dispatch:

jobs:
  fetch-music:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Fetch Soul Sync from Free Music Archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          PAGE='https://freemusicarchive.org/music/Ketsa/cc-by-free-to-use-for-anything/soul-sync/'
          curl -L --fail --retry 3 -A 'Mozilla/5.0' "$PAGE" -o /tmp/page.html
          python3 - <<'PY'
          import re, html
          text=open('/tmp/page.html','r',encoding='utf-8',errors='ignore').read()
          text=html.unescape(text).replace('\\/','/')
          pats=[
              r'https://files\.freemusicarchive\.org/storage-freemusicarchive-org/tracks/[^"\'<> ]+?\.mp3',
              r'"fileUrl"\s*:\s*"(https:[^"]+?\.mp3)"',
              r'"url"\s*:\s*"(https://files\.freemusicarchive\.org/[^"]+?\.mp3)"'
          ]
          urls=[]
          for p in pats:
              for m in re.finditer(p,text):
                  u=m.group(1) if m.groups() else m.group(0)
                  u=u.replace('\\u0026','&')
                  if u not in urls: urls.append(u)
          if not urls:
              raise SystemExit('No FMA MP3 URL found in page HTML')
          print(urls[0])
          open('/tmp/music_url.txt','w').write(urls[0])
          PY
          MUSIC_URL=$(cat /tmp/music_url.txt)
          curl -L --fail --retry 3 -A 'Mozilla/5.0' "$MUSIC_URL" -o out/Ketsa_Soul_Sync.mp3
          test -s out/Ketsa_Soul_Sync.mp3
          ffprobe -v error -show_entries format=duration,size,bit_rate:format_tags=artist,title,album -show_entries stream=codec_name,sample_rate,channels,bit_rate -of json out/Ketsa_Soul_Sync.mp3 > out/Ketsa_Soul_Sync_ffprobe.json
          printf '%s\n' \
            'Track: Soul Sync' \
            'Artist: Ketsa' \
            'Source: Free Music Archive' \
            'License: CC BY 4.0' \
            'AI generated: No (per FMA track metadata)' \
            'Attribution required for published use.' \
            "Source URL: $PAGE" \
            "MP3 URL: $MUSIC_URL" > out/LICENSE_ATTRIBUTION.txt

      - uses: actions/upload-artifact@v4
        with:
          name: viarove-v10-soul-sync-source
          path: out/
          retention-days: 7
